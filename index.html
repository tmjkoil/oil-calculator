<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <title>商品标价立减毛利计算器</title>
  <style>
    :root{--ink:#20201d;--muted:#73736c;--line:#e9e7df;--accent:#d95c42;--gold:#c99846}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#f6f1e6,#fffefa 45%,#f5eee3);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.page{width:min(1180px,calc(100% - 32px));margin:auto;padding:68px 0 34px}.hero{max-width:720px;margin-bottom:42px}.eyebrow,.step{color:var(--accent);letter-spacing:.14em;font-size:12px;font-weight:800}h1{font-size:clamp(38px,6vw,72px);line-height:1.03;letter-spacing:-.065em;margin:12px 0 18px}h1 em{color:var(--accent);font-family:Georgia,"Songti SC",serif;font-weight:400}.intro{color:var(--muted);font-size:16px;line-height:1.75;margin:0}.card,.results{background:rgba(255,254,250,.82);border:1px solid rgba(32,32,29,.1);box-shadow:0 16px 38px rgba(91,66,35,.06);border-radius:20px}.card{padding:28px}.heading,.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.heading>div,.result-head>div{display:flex;align-items:baseline;gap:11px}h2{font-size:19px;letter-spacing:-.035em;margin:0}.actions{display:flex;gap:8px;align-items:center}.shipping{display:flex;align-items:center;gap:5px;background:#fff0e8;color:#a4432e;padding:5px 8px 5px 10px;border-radius:20px;font-size:12px;font-weight:700}.shipping input{width:52px;border:0;background:transparent;padding:3px;color:#a4432e;font-weight:800}.clear{border:1px solid #d8d0c2;background:transparent;color:#746d62;padding:7px 10px;border-radius:20px;font-size:12px;font-weight:700}.clear:hover{border-color:var(--accent);color:var(--accent)}.quick{margin-bottom:23px}.quick summary{font-weight:800;cursor:pointer;list-style:none}.quick summary::-webkit-details-marker{display:none}.quick summary:before{content:'＋';color:var(--accent);margin-right:8px}.quick p{color:var(--muted);font-size:13px;line-height:1.7;margin:14px 0 10px}.quick textarea{width:100%;min-height:108px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--ink);outline:none}.quick textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,152,70,.16)}.quick button{margin-top:10px;border:0;background:var(--accent);color:#fff;border-radius:9px;padding:10px 13px;font-size:13px;font-weight:800}.quick-output{display:grid;gap:16px;margin-top:16px}.quick-result{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fffefa}.quick-result h3{padding:15px 16px;margin:0;font-size:16px;border-bottom:1px solid var(--line)}.quick-spec{padding:14px 16px;border-bottom:1px solid var(--line)}.quick-spec:last-child{border-bottom:0}.quick-spec strong{display:block;margin-bottom:8px}.quick-prices{display:flex;flex-wrap:wrap;gap:8px}.quick-price{background:#f9f3e8;border-radius:7px;padding:6px 8px;color:#6d5c47;font-size:12px}.quick-price b{color:var(--accent);margin-left:4px}.field{display:block;color:var(--muted);font-size:13px;font-weight:700;margin:28px 0 21px}input{border:1px solid var(--line);background:#fff;outline:none;color:var(--ink);border-radius:10px;min-width:0}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,152,70,.16)}.field input{width:100%;display:block;margin-top:8px;padding:13px 14px;font-size:16px}.labels,.spec{display:grid;grid-template-columns:1fr 150px 38px;gap:10px;align-items:center}.labels{color:var(--muted);font-size:12px;font-weight:700;padding:0 1px 8px}.list{display:grid;gap:10px}.spec>input,.cost{width:100%;height:45px}.spec>input{padding:0 12px}.cost{display:flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding-left:12px;color:var(--muted)}.cost input{border:0;box-shadow:none!important;padding:0 10px 0 5px;height:100%;width:100%;border-radius:0}.remove{border:0;background:transparent;color:#aaa69c;font-size:27px;height:38px;width:38px;border-radius:8px}.remove:hover{color:var(--accent);background:#fff0ea}.add{margin-top:16px;border:1px dashed #d6c8b4;background:transparent;color:#8b6737;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700}.results{margin-top:23px;overflow:hidden}.result-head{padding:28px 28px 22px}.result-head p{color:var(--muted);font-size:13px;margin:4px 0 0}.wrap{overflow-x:auto;border-top:1px solid var(--line)}table{border-collapse:collapse;min-width:900px;width:100%}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:20px}thead th{background:#f4efe5;color:#5f584c;font-size:13px;font-weight:800}thead small{color:#999183;font-size:11px;font-weight:500}.goal{display:flex;align-items:center;justify-content:space-between;gap:8px}.goal span{font-size:17px}.goal button{border:1px solid #d5cab9;background:#fffefa;border-radius:6px;color:#756452;padding:4px 7px;font-size:11px;font-weight:700}.goal button:hover{border-color:var(--accent);color:var(--accent)}tbody tr:last-child>*{border-bottom:0}tbody>tr>th{width:130px;min-width:130px;background:rgba(250,247,241,.45)}tbody>tr>th strong{display:block;font-size:16px;margin-bottom:9px}tbody>tr>th span{color:var(--muted);display:block;font-size:12px;line-height:1.8;font-weight:400}.price{color:var(--accent);font-size:25px;font-weight:800;letter-spacing:-.04em;margin-bottom:10px}.line{display:grid;grid-template-columns:1fr auto;column-gap:9px;color:var(--muted);font-size:11px;line-height:1.7;padding:5px 0;border-top:1px dashed #eeeae1}.line b{font-weight:500}.line strong,.line small{grid-column:1/-1}.line strong{color:var(--ink);font-size:13px}.line small{color:#91897d;font-size:11px;font-weight:400}.empty{padding:56px 28px;color:var(--muted);text-align:center}footer{color:#8a8478;font-size:12px;text-align:center;margin:25px 0 0}@media(max-width:640px){.page{width:min(100% - 20px,1180px);padding-top:38px}.hero{margin-bottom:27px}h1{font-size:43px}.card{padding:19px 15px}.heading{display:block}.actions{margin-top:12px}.labels,.spec{grid-template-columns:1fr 110px 30px;gap:7px}.labels{font-size:11px}.result-head{padding:21px 16px 18px}.result-head>div{display:block}th,td{padding:15px}}
  </style>
</head>
<body><main class="page"><section class="hero"><p class="eyebrow">PRICING TOOL · 立减毛利计算器</p><h1>算清每一档标价，<em>安心卖货。</em></h1><p class="intro">以日常 10% 立减后的实际成交价为毛利率基准，自动反推满足目标的最低整数标价。</p></section><details class="card quick"><summary>快捷输入</summary><p>每行一个商品：<code>萨曼莎 230 260 42%</code>。商品名称可省略；百分比会作为该商品的额外毛利档位。</p><textarea id="quick-input" aria-label="快捷输入" placeholder="萨曼莎 230 260 42%&#10;久野 250 270&#10;240"></textarea><button id="quick-calculate">解析并计算</button><div id="quick-output" class="quick-output"></div></details><section class="card"><div class="heading"><div><span class="step">01</span><h2>录入商品与规格</h2></div><div class="actions"><label class="shipping">运费 ¥<input id="shipping" inputmode="decimal" value="10"></label><button class="clear" id="clear">全部清除</button></div></div><label class="field">商品名称<input id="product" placeholder="例如：红玫古堡"></label><div class="labels"><span>规格名称</span><span>供货成本（元）</span><span></span></div><div class="list" id="specs"></div><button class="add" id="add">＋ 添加规格</button></section><section class="results"><div class="result-head"><div><span class="step">02</span><div><h2 id="result-name">商品报价结果</h2><p id="cost-note">总成本 = 供货成本 + 运费 ¥10</p></div></div></div><div id="output"></div></section><footer>计算规则：总成本 = 供货成本 + 运费；立减金额均向上取整。</footer></main>
<script>
  const goals=[.35,.4,.45], discounts=[{r:.1,n:'日常 · 10%立减'},{r:.12,n:'活动 · 12%立减'},{r:.15,n:'大促 · 15%立减'}];let specs=[];
  const fmt=n=>'¥'+Number(n).toLocaleString('zh-CN'), off=(p,r)=>Math.ceil(p*r), margin=(p,c,r)=>{let received=p-off(p,r);return received>0?(received-c)/received:0};
  function minPrice(cost,target){let low=1,high=Math.max(100,Math.ceil(cost/(1-target)*2));while(margin(high,cost,.1)<target)high*=2;while(low<high){let mid=Math.floor((low+high)/2);if(margin(mid,cost,.1)>=target)high=mid;else low=mid+1}return low}
  const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"})[char]);
  function parseQuickLine(line){let tokens=line.trim().split(/\s+/).filter(Boolean),costs=[],custom=[],names=[];tokens.forEach(token=>{if(/^\d+%$/.test(token)){let value=Number(token.slice(0,-1));if(value>0&&value<100)custom.push(value/100)}else if(/^\d+(?:\.\d+)?$/.test(token)){costs.push(Number(token))}else names.push(token)});return costs.length?{name:names.join(' '),costs,goals:[...new Set([...goals,...custom])].sort((a,b)=>a-b)}:null}
  function renderQuick(){let raw=document.querySelector('#quick-input').value,shipping=Math.max(0,Number(document.querySelector('#shipping').value)||0),items=raw.split(/\r?\n/).map(parseQuickLine).filter(Boolean),out=document.querySelector('#quick-output');if(!items.length){out.innerHTML=raw.trim()?'<div class="empty">请在每行输入至少一个成本。</div>':'';return}out.innerHTML=items.map((item,itemIndex)=>'<article class="quick-result"><h3>'+escapeHtml(item.name||'未命名商品')+'</h3>'+item.costs.map((cost,index)=>'<div class="quick-spec"><strong>规格'+(index+1)+' · 供货价 '+fmt(cost)+' · 总成本 '+fmt(cost+shipping)+'</strong><div class="quick-prices">'+item.goals.map(goal=>'<span class="quick-price">'+(goal*100)+'% <b>标价 '+fmt(minPrice(cost+shipping,goal))+'</b></span>').join('')+'</div></div>').join('')+'</article>').join('')}
  function reset(){specs=[1,2,3,4].map(i=>({id:Date.now()+i,name:'规格'+i,cost:''}));document.querySelector('#product').value='';document.querySelector('#shipping').value='10';renderSpecs();render()}
  function renderSpecs(){document.querySelector('#specs').innerHTML=specs.map((s,i)=>`<div class="spec"><input aria-label="规格名称" value="${s.name.replaceAll('"','&quot;')}" data-name="${s.id}" placeholder="例如：标准"><div class="cost">¥<input aria-label="供货成本" inputmode="decimal" value="${s.cost}" data-cost="${s.id}" placeholder="0"></div><button class="remove" data-remove="${s.id}" aria-label="删除规格">×</button></div>`).join('');document.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>{specs.find(s=>s.id==e.dataset.name).name=e.value;render()});document.querySelectorAll('[data-cost]').forEach(e=>e.oninput=()=>{specs.find(s=>s.id==e.dataset.cost).cost=e.value;render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{if(specs.length>1){specs=specs.filter(s=>s.id!=e.dataset.remove);renderSpecs();render()}})}
  function copy(goal){let product=document.querySelector('#product').value.trim()||'未命名商品',shipping=Math.max(0,Number(document.querySelector('#shipping').value)||0),lines=[product];specs.filter(s=>s.cost.trim()!==''&&Number.isFinite(Number(s.cost))&&Number(s.cost)>=0).forEach((s,i)=>{let p=minPrice(Number(s.cost)+shipping,goal);lines.push(`${s.name.trim()||'规格'+(i+1)}｜标价 ${fmt(p)}｜10%立减 ${fmt(off(p,.1))}`)});navigator.clipboard.writeText(lines.join('\n')).catch(()=>{let t=document.createElement('textarea');t.value=lines.join('\n');document.body.append(t);t.select();document.execCommand('copy');t.remove()})}
  function render(){let shipping=Math.max(0,Number(document.querySelector('#shipping').value)||0),product=document.querySelector('#product').value.trim(),valid=specs.map((s,i)=>({...s,display:s.name.trim()||'规格'+(i+1),supplyCost:Number(s.cost),hasCost:s.cost.trim()!==''})).filter(s=>s.hasCost&&Number.isFinite(s.supplyCost)&&s.supplyCost>=0);document.querySelector('#result-name').textContent=product||'商品报价结果';document.querySelector('#cost-note').textContent='总成本 = 供货成本 + 运费 '+fmt(shipping);let out=document.querySelector('#output');if(!valid.length){out.innerHTML='<div class="empty">请至少填写一条供货成本。</div>';return}out.innerHTML='<div class="wrap"><table><thead><tr><th>规格 / 成本</th>'+goals.map(g=>`<th><div class="goal"><span>${g*100}%</span><button data-copy="${g}">复制</button></div><small>最低整数标价</small></th>`).join('')+'</tr></thead><tbody>'+valid.map(s=>{let total=s.supplyCost+shipping;return '<tr><th><strong>'+s.display+'</strong><span>供货价 '+fmt(s.supplyCost)+'</span><span>总成本 <b>'+fmt(total)+'</b></span></th>'+goals.map(g=>{let p=minPrice(total,g);return '<td><div class="price">'+fmt(p)+'</div>'+discounts.map(d=>{let reduction=off(p,d.r),received=p-reduction;return '<div class="line"><span>'+d.n+'</span><b>−'+fmt(reduction)+'</b><strong>'+fmt(received)+'</strong>'+(d.r!==.1?'<small>参考毛利率 '+(margin(p,total,d.r)*100).toFixed(1)+'%</small>':'')+'</div>'}).join('')+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(Number(b.dataset.copy)))}
  document.querySelector('#product').oninput=render;document.querySelector('#shipping').oninput=()=>{render();renderQuick()};document.querySelector('#quick-calculate').onclick=renderQuick;document.querySelector('#clear').onclick=reset;document.querySelector('#add').onclick=()=>{let n=specs.length+1;specs.push({id:Date.now(),name:'规格'+n,cost:''});renderSpecs();render()};reset();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
